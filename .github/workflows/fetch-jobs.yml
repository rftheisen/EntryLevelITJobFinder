name: Fetch Entry Level IT Jobs

on:
  schedule:
    - cron: '0 6 * * *'   # runs every day at 6am UTC
  workflow_dispatch:        # lets you trigger it manually from the Actions tab

jobs:
  fetch-jobs:
    runs-on: ubuntu-latest

    permissions:
      contents: write       # needed to commit jobs.json back to the repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch jobs
        run: python fetch_jobs.py

      - name: Commit updated jobs.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add jobs.json
          git diff --staged --quiet || git commit -m "chore: refresh job listings [$(date -u '+%Y-%m-%d')]"
          git push
